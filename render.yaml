services:
  - type: web
    name: muse-arena
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: python3 app.py
    envVars:
      # Set in the Render dashboard (kept out of git). When present the app
      # uses Postgres; otherwise it falls back to local SQLite.
      - key: DATABASE_URL
        sync: false
